name: NE FEC weekly pull

on:
  schedule:
    # Both fire every Sunday; the gate step lets through only the entry
    # matching the current UTC offset, so exactly one does anything on any
    # given Sunday. Two entries exist because GitHub Actions cron is UTC-only
    # with no DST awareness -- see ne-lobbying's daily.yml for the incident
    # that made gating on the fired cron entry (not the wall clock) the rule.
    - cron: '0 8 * * 0'   # 3am Central during CDT (UTC-5, 08:00 UTC)
    - cron: '0 9 * * 0'   # 3am Central during CST (UTC-6, 09:00 UTC)
  workflow_dispatch: {}

permissions:
  contents: write  # for `gh release create` below (data-release publish for ne-connect)
  actions: write   # for `gh cache delete` cleanup

concurrency:
  group: ne-fec-weekly
  cancel-in-progress: false   # never cancel a run that might be mid-write to data/

jobs:
  weekly:
    runs-on: ubuntu-latest
    # indiv<yy>.zip is multi-GB (README: 11-60 min to download alone, plus
    # unmeasured filter/decode time) -- budgeted as a bounded weekly job, not
    # a nightly one, per PLAN.md Phase 3. 360 (GitHub's own hard per-job cap,
    # so this is already the practical ceiling) rather than 180: a cold start
    # (no past-cycle data cached at all) now pulls every past cycle in the
    # same run -- see "Pull every past cycle's cn/cm/indiv" below -- and a
    # warm run still finishes in the old single-cycle time regardless, so the
    # higher ceiling costs nothing there.
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v5

      - name: Pick the DST-correct cron entry, and today's current FEC cycle
        id: gate
        env:
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          offset=$(TZ=America/Chicago date +%z)
          case "$offset" in
            -0500) want='0 8 * * 0' ;;   # CDT
            -0600) want='0 9 * * 0' ;;   # CST
            *)     want='' ;;
          esac

          if [ "${{ github.event_name }}" = 'workflow_dispatch' ]; then
            proceed=true
          elif [ -n "$want" ] && [ "$SCHEDULE" = "$want" ]; then
            proceed=true
          else
            proceed=false
            echo "Central offset is $offset, so today's real run is cron '$want'; this run came from '$SCHEDULE'. Skipping."
          fi

          # FEC's two-year election cycle is keyed by its even ending year
          # (2024, 2026, ...) -- the "current" cycle a weekly pull refreshes.
          year=$(TZ=America/Chicago date +%Y)
          if [ $((year % 2)) -eq 1 ]; then cycle=$((year + 1)); else cycle=$year; fi

          echo "proceed=$proceed" >> "$GITHUB_OUTPUT"
          echo "cycle=$cycle" >> "$GITHUB_OUTPUT"
          echo "Central offset $offset -> proceed=$proceed cycle=$cycle"

      - uses: actions/setup-python@v6
        if: steps.gate.outputs.proceed == 'true'
        with:
          python-version: '3.11'

      - name: Install dependencies
        if: steps.gate.outputs.proceed == 'true'
        run: pip install -r requirements.txt

      - name: Tests
        if: steps.gate.outputs.proceed == 'true'
        run: python3 -m pytest tests/ -q

      - name: Restore data/ cache (older cycles, never re-downloaded)
        if: steps.gate.outputs.proceed == 'true'
        id: restore
        uses: actions/cache/restore@v5
        with:
          path: data
          key: ne-fec-data-${{ github.run_id }}
          restore-keys: |
            ne-fec-data-

      # Log-only -- nothing below is gated on this. `cache-hit` (the obvious
      # output) is true only on an EXACT primary-key match, and the primary
      # key above embeds github.run_id, unique every run, so cache-hit is
      # 'false' on every run forever, hit or miss. cache-matched-key is the
      # real "did restore-keys match anything at all" signal (same trap
      # ne-contracts/pages.yml's "Restore the last built payload" step
      # already avoids by using cache-matched-key over cache-hit).
      - name: Note a full cache miss, if this is one
        if: steps.gate.outputs.proceed == 'true' && steps.restore.outputs.cache-matched-key == ''
        run: echo "::warning::no data/ cache found under any ne-fec-data- key -- the pull-every-past-cycle step below will do real downloads instead of its usual no-op skips."

      # Pull every past cycle's cn/cm/indiv on EVERY run, not gated on the
      # cache-miss check above. download_bulk.py already skips a dataset
      # whose file exists locally (dest.exists(), its own module docstring)
      # without touching the network, so once a past cycle is cached this is
      # a handful of cheap subprocess calls that print "already have ...,
      # skipping" -- not a re-download. No --force: a past cycle's data
      # never changes (nothing left to amend), unlike the current cycle
      # below.
      #
      # Deliberately unconditional rather than cache-miss-gated: a miss-gated
      # version would look right in the diff but stay broken in production.
      # This workflow's own first real run (2026-09-19) hit a genuine full
      # miss, pulled only the current cycle, and its own "Save data/ cache"
      # step below banked that as a real cache entry. Every run after that
      # matches a real, non-empty cache-matched-key -- so a step gated on
      # "is this a miss" would see "no" forever and never pull the missing
      # past cycle. Running this unconditionally self-heals that (and any
      # future partial or evicted cache) without depending on cache-hit
      # semantics for correctness.
      #
      # FEC_START_CYCLE isn't defined anywhere else in this repo (no
      # project-wide "cycles we cover" constant exists in download_bulk.py,
      # normalize.py, or a PLAN.md -- this repo has none). 2024 is simply the
      # earliest cycle this project has ever pulled or validated against
      # (README.md, data/scrape_meta.json). If the intended historical scope
      # changes, update it here and in README.md -- nothing else reads it.
      - name: Pull every past cycle's cn/cm/indiv (no-op once cached)
        if: steps.gate.outputs.proceed == 'true'
        env:
          FEC_START_CYCLE: 2024
        run: |
          current=${{ steps.gate.outputs.cycle }}
          cycle=$FEC_START_CYCLE
          while [ "$cycle" -lt "$current" ]; do
            echo "past cycle $cycle: cn/cm/indiv, no --force"
            python3 scripts/download_bulk.py --cycle "$cycle" --datasets cn cm indiv
            cycle=$((cycle + 2))
          done

      # --force: download_bulk.py otherwise skips any dataset whose file
      # already exists locally (see its module docstring) -- for a PAST
      # cycle that's correct (nothing left to change), but the whole point of
      # a weekly pull on the CURRENT cycle is to catch amendments FEC posts
      # to it continuously. Without --force this job would silently stop
      # refreshing the current cycle after its first successful run.
      - name: Pull the current cycle's cn/cm/indiv
        if: steps.gate.outputs.proceed == 'true'
        run: >
          python3 scripts/download_bulk.py --cycle ${{ steps.gate.outputs.cycle }}
          --datasets cn cm indiv --force

      # No --cycle: normalize.py combines every cycle it finds raw data for
      # under data/raw/ (restored from cache above, plus this run's freshly
      # pulled current cycle) into one write -- passing only the current
      # cycle here would silently drop every older cycle's rows from the
      # combined output (the real bug this project's own history found).
      - name: Normalize (all cycles found under data/raw/)
        if: steps.gate.outputs.proceed == 'true'
        run: python3 scripts/normalize.py

      - name: check_data.py (duplicate-key + privacy-column gate)
        if: steps.gate.outputs.proceed == 'true'
        run: python3 scripts/check_data.py

      - name: Check data/ is worth caching
        id: cachecheck
        if: always() && steps.gate.outputs.proceed == 'true'
        run: |
          if ls data/fec_committees_ne.csv >/dev/null 2>&1; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
            du -sh data
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::data holds no fec_committees_ne.csv -- skipping the cache save so the existing good cache stays the newest match."
          fi

      - name: Save data/ cache
        if: always() && steps.cachecheck.outputs.ok == 'true'
        uses: actions/cache/save@v5
        with:
          path: data
          key: ne-fec-data-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Delete old data/ cache entries (keep newest 3)
        if: always() && steps.cachecheck.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh cache list --key ne-fec-data- --json id,createdAt --limit 100 \
            | jq -r 'sort_by(.createdAt) | reverse | .[3:] | .[].id' \
            | xargs -r -n1 gh cache delete

      # ne-connect (the hub) can't read this repo's gitignored data/ directly,
      # and Actions caches are strictly repo-scoped -- a release is the one
      # thing that crosses that boundary (ne-lobbying's own monthly backup
      # already does this, PLAN.md 0.5). ne-connect-nightly.yml downloads the
      # latest ne-fec-data-* release. Warn rather than fail: a missed release
      # here should never take down a pull that already succeeded.
      - name: Publish a data release for ne-connect
        if: always() && steps.cachecheck.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release
          for f in data/fec_committees_ne.csv data/fec_candidates_ne.csv data/fec_contributions_ne.csv; do
            [ -f "$f" ] && gzip -c "$f" > "release/$(basename "$f").gz"
          done
          if ls release/*.gz >/dev/null 2>&1; then
            tag="ne-fec-data-$(TZ=America/Chicago date +%Y-%m-%d)"
            # Same-day re-run (a manual re-dispatch to pick up a fix, exactly
            # what happened testing this workflow on 2026-09-19) would
            # otherwise hit "a release with the same tag name already
            # exists" and silently keep serving the FIRST run's stale data
            # -- delete any existing same-day release first so a re-run
            # actually replaces it.
            gh release delete "$tag" --repo diepjustin/ne-fec --yes 2>/dev/null || true
            gh release create "$tag" release/*.gz \
              --repo diepjustin/ne-fec \
              --title "FEC hub data — $(TZ=America/Chicago date +%Y-%m-%d)" \
              --notes "Automated data export for ne-connect-nightly.yml. See ne-connect's PLAN.md." \
              || echo "::warning::gh release create failed -- ne-connect will build from its previous release tonight"
          else
            echo "::warning::nothing to release -- skipping"
          fi

      - name: Delete old hub-data releases (keep newest 3)
        if: always() && steps.cachecheck.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --repo diepjustin/ne-fec --json tagName,createdAt --limit 100 \
            | jq -r '[.[] | select(.tagName | startswith("ne-fec-data-"))] | sort_by(.createdAt) | reverse | .[3:] | .[].tagName' \
            | xargs -r -n1 -I{} gh release delete {} --repo diepjustin/ne-fec --yes
